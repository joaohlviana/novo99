name: Remote read-only smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/remote-readonly-smoke.yml
      - tests/remote-readonly-smoke.mjs

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      BASE_URL: https://novo99-five.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node tests/remote-readonly-smoke.mjs
