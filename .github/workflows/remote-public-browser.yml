name: Remote public browser QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/remote-public-browser.yml
      - tests/browser/remote-public-qa.e2e.mjs
      - tests/browser/synthetic-login-guard.mjs
      - tests/browser/synthetic-login-guard.mjs
      - tests/synthetic-login-guard.test.mjs

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      BASE_URL: https://novo99-five.vercel.app
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node --test tests/synthetic-login-guard.test.mjs
      - name: Install fixed browser test dependency
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
      - name: Install Chromium in runner
        run: npx playwright install --with-deps chromium
      - name: Check public preview with invalid synthetic login
        run: node tests/browser/remote-public-qa.e2e.mjs
